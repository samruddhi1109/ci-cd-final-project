apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test-task
spec:
  steps:
    - name: Run unit tests with nose
      image: python:3.10
      script: |
        pip install nose
        nosetests
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
spec:
  params:
    - name: WORKSPACE_SOURCE_PATH
      default: /workspace
  steps:
    - name: cleanup
      image: alpine
      script: |
        rm -rf $(params.WORKSPACE_SOURCE_PATH)/*
